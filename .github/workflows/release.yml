# Release pipeline for the query-exe client.
#
# Release flow (create a GitHub release with tag e.g. 0.0.3):
#   1. jar        — sets the Maven version from the release tag (the tag is the
#                   single source of truth; app.properties' app.version is
#                   filtered from it; a leading "v" is tolerated and stripped),
#                   builds the fat jar and a .sha256 sidecar, attaches both to
#                   the release.
#   2. installer / appimage — build the launcher from the launcher/ folder of
#                   THIS repo (same commit, same version), bundle the exact jar
#                   built in step 1 as the seed, and attach the resulting
#                   QueryExe-Setup-<v>.exe / QueryExe-<v>-x86_64.AppImage
#                   (+ .sha256 sidecars) to the SAME release. The AppImage is
#                   also attached as query-exe-launcher-linux.AppImage.
#   3. launcher-jar — builds launcher/ as a plain Windows jar and attaches it as
#                   query-exe-launcher-windows.jar (the self-update payload).
#
# Manual flow (Actions tab -> Run workflow, tag = existing release e.g. 0.0.3):
#   Skips the jar build; rebuilds only the launcher artifacts from the source at
#   that tag against that release's already-published jar and replaces them on
#   the release.
#
# No hub: there is nothing to deploy to. The release assets ARE the update
# source: the launcher's UpdateManager and this client's own
# LauncherUpdateService both query this repo's GitHub releases directly.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. 0.0.3) — rebuilds only the launcher exe/AppImage/jar from this tag's source and replaces them on that release"
        required: true

permissions:
  contents: write

jobs:
  jar:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version from release tag
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build fat jar (version from tag)
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false
          # tests run in CI on push/PR, not here: they need a JavaFX toolkit the runner doesn't have
          mvn -B clean package -Ppackage -DskipTests

      - name: Compute sha256 sidecar
        run: |
          cd target
          sha256sum "query-exe-${{ steps.v.outputs.version }}.jar" | awk '{print $1}' \
            > "query-exe-${{ steps.v.outputs.version }}.jar.sha256"

      # Hands the exact released jar (+ sidecar) to the installer/appimage jobs of this run.
      - uses: actions/upload-artifact@v4
        with:
          name: client-jar
          path: |
            target/query-exe-${{ steps.v.outputs.version }}.jar
            target/query-exe-${{ steps.v.outputs.version }}.jar.sha256
          if-no-files-found: error

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.v.outputs.tag }}" \
            "target/query-exe-${{ steps.v.outputs.version }}.jar" \
            "target/query-exe-${{ steps.v.outputs.version }}.jar.sha256" \
            --clobber -R "$GITHUB_REPOSITORY"

  installer:
    name: Windows installer
    needs: jar
    # Runs after a successful jar build (release flow) or standalone when the jar
    # job was skipped (manual flow).
    if: ${{ !cancelled() && (needs.jar.result == 'success' || needs.jar.result == 'skipped') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set launcher Maven version from the release tag
        working-directory: launcher
        run: mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false

      - name: Get client jar (from this run)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: client-jar
          path: client-jar

      - name: Get client jar (from existing release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download "${{ steps.v.outputs.tag }}" \
            --pattern "query-exe-${{ steps.v.outputs.version }}.jar*" \
            --dir client-jar -R "$GITHUB_REPOSITORY"

      - name: Build installer
        working-directory: launcher
        run: |
          mvn -B clean package -Pinstaller \
            "-Dclient.version=${{ steps.v.outputs.version }}" \
            "-Dclient.jar=${{ github.workspace }}\client-jar\query-exe-${{ steps.v.outputs.version }}.jar" \
            "-Discc.path=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Compute sha256 sidecar
        run: |
          V="${{ steps.v.outputs.version }}"
          cd launcher/target/installer
          sha256sum "QueryExe-Setup-$V.exe" | awk '{print $1}' > "QueryExe-Setup-$V.exe.sha256"

      - name: Upload installer to the release
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release upload "${{ steps.v.outputs.tag }}" \
            "launcher/target/installer/QueryExe-Setup-$V.exe" \
            "launcher/target/installer/QueryExe-Setup-$V.exe.sha256" \
            --clobber -R "$GITHUB_REPOSITORY"

  appimage:
    name: Linux AppImage
    needs: jar
    if: ${{ !cancelled() && (needs.jar.result == 'success' || needs.jar.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set launcher Maven version from the release tag
        working-directory: launcher
        run: mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false

      - name: Get client jar (from this run)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: client-jar
          path: client-jar

      - name: Get client jar (from existing release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download "${{ steps.v.outputs.tag }}" \
            --pattern "query-exe-${{ steps.v.outputs.version }}.jar*" \
            --dir client-jar -R "$GITHUB_REPOSITORY"

      - name: Install appimagetool
        run: |
          mkdir -p ~/.local/bin
          curl -Lo ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool

      - name: Build AppImage
        working-directory: launcher
        run: |
          mvn -B clean package -Pappimage \
            "-Dclient.version=${{ steps.v.outputs.version }}" \
            "-Dclient.jar=$GITHUB_WORKSPACE/client-jar/query-exe-${{ steps.v.outputs.version }}.jar"

      # The same AppImage doubles as the launcher self-update payload on Linux
      # (an AppImage is replaced as a whole), under the name LauncherUpdateService expects.
      - name: Compute sha256 sidecars
        run: |
          V="${{ steps.v.outputs.version }}"
          cd launcher/target/appimage
          cp "QueryExe-$V-x86_64.AppImage" query-exe-launcher-linux.AppImage
          sha256sum "QueryExe-$V-x86_64.AppImage" | awk '{print $1}' > "QueryExe-$V-x86_64.AppImage.sha256"
          sha256sum query-exe-launcher-linux.AppImage | awk '{print $1}' > query-exe-launcher-linux.AppImage.sha256

      - name: Upload AppImage to the release
        run: |
          V="${{ steps.v.outputs.version }}"
          cd launcher/target/appimage
          gh release upload "${{ steps.v.outputs.tag }}" \
            "QueryExe-$V-x86_64.AppImage" "QueryExe-$V-x86_64.AppImage.sha256" \
            query-exe-launcher-linux.AppImage query-exe-launcher-linux.AppImage.sha256 \
            --clobber -R "$GITHUB_REPOSITORY"

  launcher-jar:
    name: Launcher self-update jar (Windows)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows-native launcher jar
        working-directory: launcher
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B clean package -Pwin-natives
          cp target/query-exe-launcher.jar query-exe-launcher-windows.jar
          sha256sum query-exe-launcher-windows.jar | awk '{print $1}' > query-exe-launcher-windows.jar.sha256

      - name: Attach to the release
        run: |
          gh release upload "${{ steps.v.outputs.tag }}" \
            launcher/query-exe-launcher-windows.jar launcher/query-exe-launcher-windows.jar.sha256 \
            --clobber -R "$GITHUB_REPOSITORY"
